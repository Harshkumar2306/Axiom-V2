model:
  name: "Axiom-v2-476M"
  vocab_size: 100277     # cl100k_base tiktoken vocab size
  max_seq_len: 2048      # Reduced from 4096 to prevent Logits VRAM overflow on T4
  d_model: 1024          # Embedding dimension
  n_layers: 24           # 24 Layers
  n_heads: 16            # Query heads
  n_kv_heads: 4          # GQA enabled (4:1) for 10-15% speedup
  multiple_of: 256       # SwiGLU hidden dim rounding
  ffn_dim_multiplier: null
  norm_eps: 1.0e-5       # RMSNorm epsilon
  rope_theta: 500000.0   # RoPE base theta for long context

training:
  batch_size: 1          # Dropped to 1 to fix PyTorch memory fragmentation
  grad_accum_steps: 32   # Set to 32 to maintain exact same effective batch math (64)
  clip_grad_norm: 1.0
  eval_iters: 100
  eval_interval: 100
  checkpoint_interval: 500
  learning_rate: 3.0e-4
  weight_decay: 0.1
  max_steps: 35000       # 1 Epoch (4.5 Billion tokens) for the 4.5B dataset
  dtype: "float16"       # T4 preference
  seed: 42               # Deterministic training seed
  gradient_checkpointing: true   # Trades ~30% compute for ~50% activation memory
  compile: false         # torch.compile() — enable on A100/H100 for max throughput

scheduler:
  type: "cosine_warm_restarts"
  T_0: 5000
  T_mult: 2
  eta_min: 1.0e-5

# Phase 4 — Supervised Fine-Tuning (train_sft.py)
sft:
  data_path: "./dataset/sft/sft_data.pt"
  learning_rate: 2.0e-5  # ~10x smaller than pretraining LR
  max_steps: 1562        # optimizer steps for 1 Epoch of 50K dataset (batch=32)
  eval_interval: 50      # optimizer steps between evals
  log_interval: 1        # Real-time logging every step
  eval_iters: 50
  eta_min: 1.0e-6
