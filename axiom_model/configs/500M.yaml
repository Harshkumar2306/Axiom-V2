model:
  name: "Axiom-v2-500M"
  vocab_size: 100277     # cl100k_base tiktoken vocab size
  max_seq_len: 4096      # Extended context window
  d_model: 1024          # Embedding dimension
  n_layers: 24           # Transformer blocks
  n_heads: 16            # Query heads
  n_kv_heads: 4          # GQA ratio (4:1)
  multiple_of: 256       # SwiGLU hidden dim rounding
  ffn_dim_multiplier: null
  norm_eps: 1.0e-5       # RMSNorm epsilon
  rope_theta: 500000.0   # RoPE base theta for long context

training:
  batch_size: 8
  grad_accum_steps: 4
  clip_grad_norm: 1.0
  validation_batches: 100
  eval_interval: 1000
  checkpoint_interval: 1000
  learning_rate: 3.0e-4
  weight_decay: 0.1
  max_steps: 100000
  dtype: "float16"       # T4 preference
  seed: 42               # Deterministic training seed

scheduler:
  type: "cosine_warm_restarts"
  T_0: 10000
  T_mult: 2
  eta_min: 1.0e-5
