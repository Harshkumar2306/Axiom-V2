name: Keep Hugging Face Space Alive

on:
  schedule:
    # Runs every 6 hours (at minute 0 past every 6th hour: 00:00, 06:00, 12:00, 18:00 UTC)
    - cron: '0 */6 * * *'
  workflow_dispatch: # Allows manual trigger anytime from GitHub Actions tab

jobs:
  ping-space:
    name: Ping HF Space Health Endpoint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping Axiom Space Endpoint
        run: |
          echo "Sending keep-alive ping to Hugging Face Space..."
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://harsh0o23-smart-agro-api.hf.space/health || true)
          echo "Received HTTP status code: $STATUS"
          if [ "$STATUS" = "200" ]; then
            echo "✅ Hugging Face Space is healthy and awake!"
          else
            echo "⚠️ Space returned status $STATUS (or woke up from sleep)."
          fi
